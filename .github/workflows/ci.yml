name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python3 -m unittest discover tests/ -v

  pruner:
    name: pruner
    uses: ob-aion/pruner/.github/workflows/scan.yml@0.2.13
    permissions:
      contents: read
      security-events: write
      id-token: write
      attestations: write
    with:
      fail-on: critical
