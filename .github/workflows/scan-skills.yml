name: scan-skills

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  scan:
    name: scan
    uses: cisco-ai-defense/skill-scanner/.github/workflows/scan-skills.yml@ec7c7f09c38c30af00e145e113b69fae96cbeb1a # 2.0.13
    permissions:
      contents: read
      security-events: write
    with:
      skill_path: skills
      policy: balanced
      fail_on_severity: critical
