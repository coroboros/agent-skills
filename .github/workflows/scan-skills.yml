name: scan-skills

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  scan:
    name: scan
    uses: cisco-ai-defense/skill-scanner/.github/workflows/scan-skills.yml@ff708ea00fd401640112c138711c5c36ff4992a0 # 2.0.11
    permissions:
      contents: read
      security-events: write
    with:
      skill_path: skills
      policy: balanced
      fail_on_severity: critical
