<!doctype html>
<html lang="en">
<head>
  <title>Kiln Works</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <main>
    <h1>Every glaze is fired twice.</h1>
    <section>
      <h2>The second firing</h2>
      <p>A kiln holds its heat the way a room holds a conversation, unevenly and with intent.</p>
    </section>
    <section>
      <h3>Yield</h3>
      <dl class="stat-block">
        <dt>Pieces fired</dt>
        <dd class="stat">1284</dd>
        <dt>Second-fire survival</dt>
        <dd class="stat">92 percent</dd>
      </dl>
      <span class="counter" data-count="1284">0</span>
    </section>
    <section>
      <p>Each batch leaves the kiln with a record of its own temperature curve, written in the glaze.</p>
    </section>
  </main>
</body>
</html>
