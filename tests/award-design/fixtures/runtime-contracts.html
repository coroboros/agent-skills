<!doctype html>
<meta charset="utf-8">
<title>Award runtime contract regressions</title>
<!-- Open locally in a real browser. Run runRuntimeStaticCases(), then
     armRuntimePress(), drive a real click on #press, wait for settlement and
     run readRuntimePress(). Repeat arm/read on #still to prove zero motion.
     The assertions require the DOM, CSSOM and actual input; pure Node tests
     cannot replace this fixture. No remote resources or installation needed. -->
<style>
  body { margin: 24px; background: #eee; color: #222; font: 20px/1.3 Arial; }
  button { margin: 8px; min-width: 100px; min-height: 48px; }
  #flat:hover { transform: translateX(20px); }
  #nested { &:hover { transform: translateX(20px); } }
  #grouped { @media (min-width: 1px) { &:hover { transform: translateX(20px); } } }
  #parent { &:hover { span { display: inline-block; transform: translateX(20px); } } }
  .outer, .inner { display: block; }
  #deepflat:hover .outer .inner { transform: translateX(20px); }
  #deepnested:hover .outer { .inner { transform: translateX(20px); } }
  #trulydead:hover { transform: translateX(0); }
  #ambiguous:hover .outer, #absent:hover .outer { .inner { transform: translateX(20px); } }
  .labels { position: relative; width: 600px; height: 70px; }
  .labels p { position: absolute; inset: 0 auto auto 0; width: 600px; margin: 0; }
  .right { text-align: right; }
  #collision .right { text-align: left; }
  #weak:hover { transform: scale(1.02); }
</style>
<main>
  <h1 id="heading">First<br>Second<br>Third</h1>
  <section id="states">
    <button id="flat">Flat</button><button id="nested">Nested</button>
    <button id="grouped">Grouped</button><button id="parent"><span>Descendant</span></button>
    <button id="deepflat"><span class="outer"><span class="inner">Deep flat</span></span></button>
    <button id="deepnested"><span class="outer"><span class="inner">Deep nested</span></span></button>
    <button id="trulydead">Dead control</button>
    <button id="ambiguous"><span class="outer"><span class="inner">Ambiguous context</span></span></button>
  </section>
  <section class="labels" id="separated"><p>Alpha</p><p class="right">Omega</p></section>
  <section class="labels" id="collision"><p>Alpha</p><p class="right">Omega</p></section>
  <button id="weak">Weak</button>
  <button id="press">140 ms press</button><button id="still">No motion</button>
</main>
<script src="../../../skills/award-design/assets/detector.js"></script>
<script src="../../../skills/award-design/assets/render-floor.js"></script>
<script>
  const expect = (condition, message) => { if (!condition) throw new Error(message); };
  const has = (report, id) => report.findings.some(f => (f.id || f.rule) === id);
  window.runRuntimeStaticCases = async () => {
    const report = await awardDetector.run();
    for (const id of ['flat', 'nested', 'grouped', 'parent', 'deepflat', 'deepnested']) {
      expect(report.substrate.selectors.ok.some(s => s.includes('#' + id)), id + ' hover was not measured');
    }
    expect(!report.substrate.selectors.homeopathic.some(s => s.includes('#deepnested')),
      'nested descendants must not become phantom carriers');
    expect(report.substrate.selectors.homeopathic.some(s => s.includes('#trulydead')),
      'a zero-delta control must not be credited as live');
    expect(report.substrate.selectors.unmeasuredCss.some(s => s.includes('#ambiguous')),
      'ambiguous carrier must be explicitly unmeasured');
    const separated = await awardRenderFloor.run({root: '#separated'});
    const collision = await awardRenderFloor.run({root: '#collision'});
    expect(!has(separated, 'TEXT-OVERLAP'), 'disjoint text must not overlap');
    expect(has(collision, 'TEXT-OVERLAP'), 'actual overlapping text must be caught');
    const canonical = await awardDetector.run();
    expect(has(canonical, 'H1-LINES'), 'three-line h1 must fail canonical two-line ceiling');
    const exception = await awardDetector.run({h1MaxLines: 3,
      h1OverrideReason: 'Client requests three lines; DESIGN.md#hero'});
    expect(!has(exception, 'H1-LINES') && has(exception, 'H1-OVERRIDE'), 'exception must retain review evidence');
    expect(exception.options.h1MaxLines === 3 && exception.policy.canonicalH1MaxLines === 2,
      'effective/canonical ceilings missing');
    const heading = document.querySelector('#heading');
    const original = heading.innerHTML;
    try {
      heading.innerHTML += '<br>Fourth';
      const fourth = await awardDetector.run(exception.options);
      expect(has(fourth, 'H1-LINES'), 'four-line h1 must still fail');
    } finally { heading.innerHTML = original; }
    const changed = await awardDetector.run({floors:{scale:1.01}});
    expect(changed.options.floors.scale === 1.01 && changed.policy.canonicalFloors.scale === 1.04,
      'altered floors lost their provenance');
    expect(changed.policy.floorsOverridden, 'altered floors presented as canonical');
    const mutations = [];
    const observer = new MutationObserver(records => mutations.push(...records));
    observer.observe(document, {subtree:true, childList:true, attributes:true});
    let rejected = false;
    try { await awardDetector.run({h1MaxLines:3}); } catch (error) { rejected = true; }
    await Promise.resolve();
    observer.disconnect();
    expect(rejected && mutations.length === 0, 'invalid options must reject before DOM mutation');
    return {staticCases:'passed', viewport:{width:innerWidth,height:innerHeight},
      nested:report.substrate, separated:separated.findings, collision:collision.findings,
      canonicalH1:canonical.findings.filter(f => f.id.startsWith('H1')),
      exceptionH1:exception.findings.filter(f => f.id.startsWith('H1')),
      options:changed.options, policy:changed.policy};
  };
  document.querySelector('#press').addEventListener('pointerdown', event => {
    window.lastPress = {trusted:event.isTrusted, started:performance.now(), finished:null};
    const animation = event.currentTarget.animate([
      {transform:'translateX(0)'}, {transform:'translateX(40px)'}, {transform:'translateX(0)'}
    ], {duration:140});
    animation.finished.then(() => { lastPress.finished = performance.now(); });
  });
  window.armRuntimePress = async (selector = '#press') => {
    const armed = await awardDetector.measurePeak(selector, 600, 'pointerdown');
    expect(armed.armed, 'sampler failed to arm');
    const premature = await awardDetector.measurePeak(selector);
    expect(premature.error, 'untriggered read must not classify motion');
    return {armed, premature};
  };
  window.readRuntimePress = async (selector = '#press') => {
    const result = await awardDetector.measurePeak(selector);
    if (selector === '#press') {
      expect(lastPress.trusted && lastPress.finished, 'use real input and wait until the transient settles');
      expect(result.channels.translatePx > 10 && result.classification === 'OK', 'settled peak was lost');
    } else {
      expect(result.channels.translatePx === 0 && result.classification === 'DEAD', 'zero-motion control failed');
    }
    return {result, press:selector === '#press' ? lastPress : null, readAt:performance.now()};
  };
</script>
