<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Pass fixture</title>
  <style>
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    .dot { animation: pulse 2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; } }
  </style>
  <circle class="dot" cx="50" cy="50" r="20" fill="#c6a15b"/>
  <path d="M10 90 H90" pathLength="100" stroke="#c6a15b" stroke-dasharray="100" stroke-dashoffset="100" fill="none">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.5s" fill="freeze"/>
  </path>
</svg>
